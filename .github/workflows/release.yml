name: Release (build + publish)

# 1-clique: descobre a última tag vBASE-N, incrementa N, compila a matriz
# completa e publica um release NOVO (prerelease) com esse nome, com notas limpas.
# Com "lançamento" marcado, publica o release estável vBASE assinado para o atualizador do app
# (veja docs/atualizacao-app.md).
# Não depende do gatilho de push de tag (que o GITHUB_TOKEN não dispara dentro
# do Actions): chama o flutter-build.yml diretamente, e o action-gh-release cria
# a tag + o release.

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: "Versão base (sem sufixo). O release será vBASE-N com N auto-incrementado."
        type: string
        default: "1.4.8"
      lancamento:
        description: "Lançamento para os clientes: release estável vBASE (BASE = versão do Cargo.toml) com a lista assinada para o atualizador do app"
        type: boolean
        default: false

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
      date: ${{ steps.calc.outputs.date }}
    steps:
      - name: Checkout source code
        if: ${{ inputs.lancamento }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Compute next tag
        id: calc
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base_version }}
          REPO: ${{ github.repository }}
          LANCAMENTO: ${{ inputs.lancamento }}
        run: |
          set -euo pipefail
          echo "date=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          if [ "$LANCAMENTO" = "true" ]; then
            # O app compara a própria versão (Cargo.toml) com a do release: elas têm que ser iguais.
            cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            build=$(sed -n 's/^  VERSION: "\(.*\)"/\1/p' .github/workflows/flutter-build.yml | head -1)
            if [ "$BASE" != "$cargo" ] || [ "$BASE" != "$build" ]; then
              echo "::error::Versão $BASE diferente do Cargo.toml ($cargo) ou do flutter-build.yml ($build). Rode res/bump.sh antes."
              exit 1
            fi
            if gh api "repos/${REPO}/git/ref/tags/v${BASE}" >/dev/null 2>&1; then
              echo "::error::A versão v${BASE} já foi lançada; suba o número da versão."
              exit 1
            fi
            echo "tag=v${BASE}" >> "$GITHUB_OUTPUT"
            echo "Lançamento: v${BASE}"
            exit 0
          fi
          esc=$(printf '%s' "$BASE" | sed 's/\./\\./g')
          max=0
          page=1
          while :; do
            names=$(gh api "repos/${REPO}/tags?per_page=100&page=${page}" --jq '.[].name' || true)
            [ -z "$names" ] && break
            while IFS= read -r t; do
              if [[ "$t" =~ ^v?${esc}-([0-9]+)$ ]]; then
                n="${BASH_REMATCH[1]}"
                if [ "$n" -gt "$max" ]; then max="$n"; fi
              fi
            done <<< "$names"
            cnt=$(printf '%s\n' "$names" | grep -c . || true)
            [ "$cnt" -lt 100 ] && break
            page=$((page+1))
          done
          next=$((max+1))
          echo "tag=v${BASE}-${next}" >> "$GITHUB_OUTPUT"
          echo "Próxima tag: v${BASE}-${next}"

  build-and-release:
    needs: compute-version
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ needs.compute-version.outputs.tag }}

  # Só no lançamento: assina com a chave da H3 a lista dos instaladores que o atualizador do app aceita.
  assinar-atualizacao:
    needs: [compute-version, build-and-release]
    if: ${{ inputs.lancamento && needs.build-and-release.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.compute-version.outputs.tag }}
      VERSION: ${{ inputs.base_version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'

      - name: Check signing key
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.H3_UPDATE_ED25519_SEED }}
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.H3_UPDATE_ED25519_PUBLIC_KEY }}
        run: python res/update/generate_update_metadata.py check-key

      - name: Download installers
        run: |
          set -euo pipefail
          mkdir artifacts
          for f in x86_64.exe x86_64.msi aarch64.exe aarch64.msi x86-sciter.exe aarch64.dmg x86_64.dmg; do
            gh release download "$TAG" -R "$REPO" -p "h3suporte-${VERSION}-${f}" -D artifacts
          done
          ls -l artifacts

      - name: Sign update metadata
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.H3_UPDATE_ED25519_SEED }}
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.H3_UPDATE_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          a="./artifacts/h3suporte-${VERSION}"
          python res/update/generate_update_metadata.py sign \
            --artifact windows x86_64 exe "$a-x86_64.exe" \
            --artifact windows x86_64 msi "$a-x86_64.msi" \
            --artifact windows aarch64 exe "$a-aarch64.exe" \
            --artifact windows aarch64 msi "$a-aarch64.msi" \
            --artifact windows x86 exe "$a-x86-sciter.exe" \
            --artifact macos aarch64 dmg "$a-aarch64.dmg" \
            --artifact macos x86_64 dmg "$a-x86_64.dmg" \
            --version "$VERSION" --release-id "$TAG" \
            --package-id rustdesk \
            --release-base-url "https://github.com/${REPO}/releases/download" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --metadata-out ./rustdesk-update.json \
            --signature-out ./rustdesk-update.json.sig
          python res/update/generate_update_metadata.py verify \
            --metadata ./rustdesk-update.json --signature ./rustdesk-update.json.sig \
            --artifact "$a-x86_64.exe" --artifact "$a-x86_64.msi" \
            --artifact "$a-aarch64.exe" --artifact "$a-aarch64.msi" \
            --artifact "$a-x86-sciter.exe" \
            --artifact "$a-aarch64.dmg" --artifact "$a-x86_64.dmg" \
            --version "$VERSION" --release-id "$TAG" \
            --package-id rustdesk \
            --release-base-url "https://github.com/${REPO}/releases/download"

      # A assinatura antes da lista: o servidor-api só anuncia o release quando os dois estão publicados.
      - name: Publish signed update metadata
        run: |
          gh release upload "$TAG" -R "$REPO" ./rustdesk-update.json.sig
          gh release upload "$TAG" -R "$REPO" ./rustdesk-update.json

  finalize-notes:
    needs: [compute-version, build-and-release, assinar-atualizacao]
    if: ${{ always() && needs.compute-version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Linux, Android e SBOM saem do build como rustdesk-*; só o nome do arquivo no release muda
      # (o pacote instalado é o mesmo). rustdesk-update.json(.sig) fica: é o nome que o atualizador baixa.
      - name: Renomear arquivos rustdesk-* do release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || exit 0
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | "\(.id) \(.name)"' |
            while read -r id nome; do
              case "$nome" in
                rustdesk-update.json|rustdesk-update.json.sig) continue ;;
                rustdesk*) novo="h3suporte${nome#rustdesk}" ;;
                *) continue ;;
              esac
              gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$novo" >/dev/null
              echo "$nome -> $novo"
            done
      - name: Set clean release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.compute-version.outputs.tag }}
          DATE: ${{ needs.compute-version.outputs.date }}
          LANCAMENTO: ${{ inputs.lancamento }}
          ASSINADO: ${{ needs.assinar-atualizacao.result }}
        run: |
          set -euo pipefail
          printf 'H3 Suporte — versão %s\n\nBuild automático de %s.\n\nInstaladores para Windows (incluindo o cliente incoming-only), macOS, Linux, Android e Web anexados abaixo.\n' "$TAG" "$DATE" > notes.md
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            if [ "$LANCAMENTO" = "true" ] && [ "$ASSINADO" = "success" ]; then
              # Estável e "latest": é o que o servidor-api oferece ao atualizador dos apps instalados.
              gh release edit "$TAG" -R "$REPO" --title "H3 Suporte $TAG" --prerelease=false --latest --notes-file notes.md
              echo "Lançamento $TAG publicado para o atualizador."
            else
              gh release edit "$TAG" -R "$REPO" --title "H3 Suporte $TAG" --prerelease --notes-file notes.md
              echo "Notas atualizadas para $TAG."
            fi
          else
            echo "Release $TAG não encontrado (o build pode ter falhado antes do publish)."
          fi
